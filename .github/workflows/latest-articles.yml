name: Latest Medium articles

on:
  schedule:
    # 14:00 UTC = 19:30 IST, half an hour after the usual 19:00 IST Medium slot
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://medium.com/feed/@javaScriptwithvinay"
          max_post_count: 5
          commit_message: "Update latest Medium articles"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
